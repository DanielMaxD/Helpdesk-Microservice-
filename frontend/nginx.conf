server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Plain health check target for the container HEALTHCHECK / orchestrators.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # React Router uses client-side routing — any path that isn't a real
    # static file must fall back to index.html so deep links (e.g. a refresh
    # on /tickets/abc123) don't 404 against nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted Vite assets are safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
